<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="title desc">
  <title id="title">CM-530 第 19 版韌體架構</title>
  <desc id="desc">ROS 主機的文字指令經 FT232R 進入 USART3 接收中斷與環形緩衝區，主迴圈以 BridgeFeed 組行後由 bridge.c 解析驗證，再呼叫 ax12.c 的寫入或讀取函式，經 DYNAMIXEL SDK 與 USART1 送到兩支手臂的 AX-12A；LED 由 arm_led.c 控制；每筆指令回覆一行經 USART3 送回主機。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      text { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #222; }
      .title { font-size: 15px; font-weight: 700; }
      .body { font-size: 12.5px; }
      .mono { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12px; fill: #222; }
      .label { font-size: 12px; fill: #555; }
      .note { font-size: 12px; fill: #555; }
      .line { stroke: #444; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>

  <!-- ROS host -->
  <rect x="12" y="60" width="118" height="180" rx="10" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.6"/>
  <text x="71" y="128" text-anchor="middle" class="title">ROS 主機</text>
  <text x="71" y="150" text-anchor="middle" class="body">Jetson AGX Orin</text>
  <text x="71" y="170" text-anchor="middle" class="body">一問一答</text>

  <!-- FT232R -->
  <rect x="175" y="60" width="80" height="180" rx="10" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.6"/>
  <text x="215" y="140" text-anchor="middle" class="title">FT232R</text>
  <text x="215" y="160" text-anchor="middle" class="body">USB↔UART</text>

  <line x1="130" y1="88" x2="173" y2="88" class="line" marker-end="url(#arrow)"/>
  <text x="152" y="80" text-anchor="middle" class="label">指令</text>
  <line x1="175" y1="210" x2="132" y2="210" class="line" marker-end="url(#arrow)"/>
  <text x="152" y="228" text-anchor="middle" class="label">回覆</text>
  <text x="133" y="262" text-anchor="middle" class="label">USB · 1 Mbps · 8N1</text>

  <!-- CM-530 container -->
  <rect x="280" y="20" width="560" height="600" rx="12" fill="#f6f6f6" stroke="#888" stroke-width="1.4"/>
  <text x="296" y="44" class="title">CM-530 · STM32F103RE（main.c 主迴圈同步執行）</text>

  <!-- RX chain -->
  <rect x="300" y="60" width="150" height="58" rx="8" fill="#ffffff" stroke="#3b6ea8" stroke-width="1.5"/>
  <text x="375" y="84" text-anchor="middle" class="title">USART3 接收中斷</text>
  <text x="375" y="104" text-anchor="middle" class="mono">RxD1Interrupt()</text>

  <rect x="480" y="60" width="150" height="58" rx="8" fill="#ffffff" stroke="#3b6ea8" stroke-width="1.5"/>
  <text x="555" y="84" text-anchor="middle" class="title">環形緩衝區 128 B</text>
  <text x="555" y="104" text-anchor="middle" class="body">滿了 → ERR,OVERFLOW</text>

  <rect x="660" y="60" width="160" height="58" rx="8" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.5"/>
  <text x="740" y="84" text-anchor="middle" class="mono" style="font-weight:700">BridgeFeed()</text>
  <text x="740" y="104" text-anchor="middle" class="body">逐字組行 · 一行 ≤ 95 字</text>

  <line x1="255" y1="88" x2="298" y2="88" class="line" marker-end="url(#arrow)"/>
  <line x1="450" y1="89" x2="478" y2="89" class="line" marker-end="url(#arrow)"/>
  <line x1="630" y1="89" x2="658" y2="89" class="line" marker-end="url(#arrow)"/>

  <!-- process -->
  <rect x="480" y="150" width="340" height="96" rx="8" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.5"/>
  <text x="650" y="174" text-anchor="middle" class="title">bridge.c · process()</text>
  <text x="650" y="196" text-anchor="middle" class="body">正規化 → 切欄位 → 檢查格式與範圍</text>
  <text x="650" y="216" text-anchor="middle" class="body">每臂「目標資格」· 初始化失敗鎖定</text>
  <text x="650" y="236" text-anchor="middle" class="body">不合格：不寫馬達，直接回 ERR</text>
  <line x1="740" y1="118" x2="740" y2="148" class="line" marker-end="url(#arrow)"/>
  <text x="748" y="138" class="label">遇到行尾</text>

  <!-- reply -->
  <rect x="300" y="150" width="150" height="96" rx="8" fill="#ffffff" stroke="#3b6ea8" stroke-width="1.5"/>
  <text x="375" y="174" text-anchor="middle" class="mono" style="font-weight:700">BridgeOutput()</text>
  <text x="375" y="196" text-anchor="middle" class="body">TxDString()</text>
  <text x="375" y="216" text-anchor="middle" class="body">USART3 TX</text>
  <text x="375" y="236" text-anchor="middle" class="body">每筆一行 · CRLF</text>
  <line x1="480" y1="198" x2="452" y2="198" class="line" marker-end="url(#arrow)"/>
  <polyline points="300,210 270,210 257,210" class="line" marker-end="url(#arrow)"/>

  <!-- dispatch lines -->
  <polyline points="560,246 560,262 385,262 385,288" class="line" marker-end="url(#arrow)"/>
  <polyline points="600,246 600,262 575,262 575,288" class="line" marker-end="url(#arrow)"/>
  <polyline points="760,246 760,288" class="line" marker-end="url(#arrow)"/>

  <!-- ax12 write -->
  <rect x="300" y="290" width="170" height="110" rx="8" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="385" y="313" text-anchor="middle" class="title">ax12.c · 寫入</text>
  <text x="312" y="336" class="mono">Ax12WriteGoals</text>
  <text x="312" y="352" class="label">位置＋速度</text>
  <text x="312" y="372" class="mono">Ax12WriteTorque</text>
  <text x="312" y="391" class="mono">Ax12WriteCompliance</text>

  <!-- ax12 read -->
  <rect x="490" y="290" width="170" height="110" rx="8" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="575" y="313" text-anchor="middle" class="title">ax12.c · 讀取</text>
  <text x="502" y="336" class="mono">Ax12ReadPositions</text>
  <text x="502" y="352" class="label">位置＋負載</text>
  <text x="502" y="372" class="mono">Ax12ReadCompliance</text>
  <text x="502" y="391" class="mono">Ax12ReadDiag</text>

  <!-- arm_led -->
  <rect x="680" y="290" width="140" height="110" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="750" y="313" text-anchor="middle" class="title">arm_led.c</text>
  <text x="750" y="338" text-anchor="middle" class="mono">ArmLedSet()</text>
  <text x="750" y="360" text-anchor="middle" class="body">GPIO 低電位點亮</text>
  <text x="750" y="380" text-anchor="middle" class="body">紅綠互斥</text>

  <!-- SDK -->
  <rect x="300" y="436" width="360" height="76" rx="8" fill="#efeaf7" stroke="#6b5aa0" stroke-width="1.5"/>
  <text x="480" y="459" text-anchor="middle" class="title">DYNAMIXEL SDK · dynamixel.c ／ dxl_hal.c</text>
  <text x="480" y="480" text-anchor="middle" class="body">寫入：廣播 SYNC_WRITE（一臂四顆一個封包）</text>
  <text x="480" y="500" text-anchor="middle" class="body">讀取：逐顆單播 READ · 期限 50 ms · 不重試</text>
  <line x1="385" y1="400" x2="385" y2="434" class="line" marker-end="url(#arrow)"/>
  <line x1="575" y1="402" x2="575" y2="434" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="583" y="425" class="label">讀回資料</text>

  <!-- USART1 -->
  <rect x="300" y="548" width="360" height="44" rx="8" fill="#efeaf7" stroke="#6b5aa0" stroke-width="1.5"/>
  <text x="480" y="575" text-anchor="middle" class="title">USART1 · 1 Mbps 半雙工 TTL</text>
  <line x1="480" y1="514" x2="480" y2="546" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="296" y="610" class="note">bridge.c、ax12.c、dynamixel.c 不直接碰硬體，tests/test_bridge.c 以模擬 HAL 在主機上編譯測試</text>

  <!-- LEDs outside -->
  <rect x="870" y="290" width="210" height="110" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="975" y="314" text-anchor="middle" class="title">指示燈</text>
  <text x="884" y="340" class="body">arm1 綠 MANAGE（PB13）</text>
  <text x="884" y="358" class="body">arm1 紅 PROGRAM（PB14）</text>
  <text x="884" y="376" class="body">arm2 綠 TXD（PC14）</text>
  <text x="884" y="394" class="body">arm2 紅 RXD（PC15）</text>
  <line x1="820" y1="345" x2="868" y2="345" class="line" marker-end="url(#arrow)"/>

  <!-- DYNAMIXEL bus -->
  <line x1="660" y1="570" x2="852" y2="570" stroke="#6b5aa0" stroke-width="3"/>
  <line x1="852" y1="470" x2="852" y2="575" stroke="#6b5aa0" stroke-width="3"/>
  <line x1="852" y1="470" x2="868" y2="470" class="line" marker-end="url(#arrow)"/>
  <line x1="852" y1="575" x2="868" y2="575" class="line" marker-end="url(#arrow)"/>
  <text x="756" y="562" text-anchor="middle" class="label">DYNAMIXEL 匯流排</text>

  <rect x="870" y="430" width="210" height="80" rx="10" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="975" y="456" text-anchor="middle" class="title">arm1（A → B）</text>
  <text x="975" y="478" text-anchor="middle" class="body">AX-12A × 4</text>
  <text x="975" y="498" text-anchor="middle" class="body">j1 17 · j2 3 · j3 2 · j4 15</text>

  <rect x="870" y="535" width="210" height="80" rx="10" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="975" y="561" text-anchor="middle" class="title">arm2（B → C）</text>
  <text x="975" y="583" text-anchor="middle" class="body">AX-12A × 4</text>
  <text x="975" y="603" text-anchor="middle" class="body">j1 12 · j2 1 · j3 8 · j4 16</text>
</svg>
