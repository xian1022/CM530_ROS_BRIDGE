<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title desc">
  <title id="title">CM-530 第 19 版韌體架構</title>
  <desc id="desc">ROS 主機的指令經 USART3 中斷進入環形緩衝區，bridge.c 組行並解析驗證後，呼叫 ax12.c 寫入或讀取馬達，經 DYNAMIXEL SDK 與 USART1 送到兩支手臂；arm_led.c 控制指示燈；每筆指令回覆一行給主機。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      text { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #222; }
      .title { font-size: 14.5px; font-weight: 700; }
      .body { font-size: 12.5px; }
      .label { font-size: 12px; fill: #555; }
      .line { stroke: #444; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <!-- host -->
  <rect x="20" y="60" width="120" height="146" rx="10" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.6"/>
  <text x="80" y="128" text-anchor="middle" class="title">ROS 主機</text>
  <text x="80" y="148" text-anchor="middle" class="body">Jetson AGX Orin</text>
  <text x="80" y="226" text-anchor="middle" class="label">USB（FT232R）</text>
  <text x="80" y="242" text-anchor="middle" class="label">1 Mbps · 8N1</text>

  <!-- CM-530 -->
  <rect x="190" y="20" width="610" height="366" rx="12" fill="#f6f6f6" stroke="#888" stroke-width="1.4"/>
  <text x="206" y="44" class="title">CM-530（STM32F103RE）</text>

  <rect x="210" y="60" width="240" height="56" rx="8" fill="#ffffff" stroke="#3b6ea8" stroke-width="1.5"/>
  <text x="330" y="83" text-anchor="middle" class="title">接收</text>
  <text x="330" y="103" text-anchor="middle" class="body">USART3 中斷 → 128 B 環形緩衝區</text>

  <rect x="500" y="60" width="280" height="56" rx="8" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.5"/>
  <text x="640" y="83" text-anchor="middle" class="title">bridge.c 解析與驗證</text>
  <text x="640" y="103" text-anchor="middle" class="body">組行 · 檢查格式與範圍 · 目標資格</text>
  <line x1="450" y1="88" x2="498" y2="88" class="line" marker-end="url(#arrow)"/>

  <rect x="210" y="150" width="240" height="56" rx="8" fill="#ffffff" stroke="#3b6ea8" stroke-width="1.5"/>
  <text x="330" y="173" text-anchor="middle" class="title">回覆</text>
  <text x="330" y="193" text-anchor="middle" class="body">每筆一行 · USART3 TX</text>
  <polyline points="540,116 540,178 452,178" class="line" marker-end="url(#arrow)"/>

  <!-- dispatch -->
  <polyline points="600,116 600,222 302,222 302,238" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="222" x2="600" y2="238" class="line" marker-end="url(#arrow)"/>
  <polyline points="600,222 705,222 705,238" class="line" marker-end="url(#arrow)"/>

  <rect x="210" y="240" width="185" height="64" rx="8" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="302" y="262" text-anchor="middle" class="title">ax12.c 寫入</text>
  <text x="302" y="280" text-anchor="middle" class="body">位置＋速度、扭力</text>
  <text x="302" y="297" text-anchor="middle" class="body">compliance、punch</text>

  <rect x="410" y="240" width="190" height="64" rx="8" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="505" y="262" text-anchor="middle" class="title">ax12.c 讀取</text>
  <text x="505" y="280" text-anchor="middle" class="body">位置＋負載、compliance</text>
  <text x="505" y="297" text-anchor="middle" class="body">電壓、溫度</text>

  <rect x="620" y="240" width="160" height="64" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="700" y="266" text-anchor="middle" class="title">arm_led.c</text>
  <text x="700" y="288" text-anchor="middle" class="body">GPIO 低電位點亮</text>

  <rect x="210" y="336" width="390" height="40" rx="8" fill="#efeaf7" stroke="#6b5aa0" stroke-width="1.5"/>
  <text x="405" y="361" text-anchor="middle" class="title">DYNAMIXEL SDK → USART1 · 1 Mbps</text>
  <line x1="302" y1="304" x2="302" y2="334" class="line" marker-end="url(#arrow)"/>
  <line x1="505" y1="306" x2="505" y2="334" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- outside -->
  <rect x="830" y="240" width="150" height="64" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="905" y="262" text-anchor="middle" class="title">指示燈</text>
  <text x="905" y="280" text-anchor="middle" class="body">arm1 PB13／PB14</text>
  <text x="905" y="297" text-anchor="middle" class="body">arm2 PC14／PC15</text>
  <line x1="780" y1="272" x2="828" y2="272" class="line" marker-end="url(#arrow)"/>

  <line x1="600" y1="356" x2="812" y2="356" stroke="#6b5aa0" stroke-width="3"/>
  <line x1="812" y1="330" x2="812" y2="374" stroke="#6b5aa0" stroke-width="3"/>
  <line x1="812" y1="330" x2="828" y2="330" class="line" marker-end="url(#arrow)"/>
  <line x1="812" y1="374" x2="828" y2="374" class="line" marker-end="url(#arrow)"/>
  <rect x="830" y="316" width="150" height="30" rx="8" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="905" y="336" text-anchor="middle" class="body">arm1：17 · 3 · 2 · 15</text>
  <rect x="830" y="360" width="150" height="30" rx="8" fill="#e9f6ec" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="905" y="380" text-anchor="middle" class="body">arm2：12 · 1 · 8 · 16</text>

  <!-- host link, drawn over the CM-530 frame -->
  <line x1="140" y1="88" x2="208" y2="88" class="line" marker-end="url(#arrow)"/>
  <text x="174" y="80" text-anchor="middle" class="label">指令</text>
  <line x1="210" y1="178" x2="142" y2="178" class="line" marker-end="url(#arrow)"/>
  <text x="176" y="196" text-anchor="middle" class="label">回覆</text>
</svg>
